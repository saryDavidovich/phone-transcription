{% extends "institution/base.html" %}
{% from "institution/_icons.html" import ic %}
{% block title %}צור קשר{% endblock %}
{% block content %}
<div class="page-narrow">
<h1>צור קשר</h1>
<div class="card">
  <div class="card-head"><span class="ic">{{ ic("mail") }}</span><h2>הודעה להנהלת המערכת</h2></div>
  <div class="card-sub">שאלה, בקשה או תקלה - ההודעה מגיעה ישירות אלינו, ונחזור אליכם בהקדם.</div>
  <form method="post">
    <div class="field">
      <label for="contactMsg">ההודעה</label>
      <textarea class="input" id="contactMsg" name="message" required rows="7" placeholder="כתבו כאן את ההודעה..." style="resize:vertical; min-height:140px;"></textarea>
    </div>
    <button type="submit" class="btn btn-block">שליחה</button>
  </form>
</div>
</div>
{% endblock %}
