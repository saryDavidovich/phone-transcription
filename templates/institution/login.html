{% extends "institution/base.html" %}
{% block title %}התחברות{% endblock %}
{% block content %}
<div style="max-width:380px; margin:80px auto;">
  <div class="card">
    <h1 style="text-align:center;">כניסת מוסד</h1>
    <form method="post">
      <label style="font-size:13px; color:var(--text2);">מייל או טלפון</label>
      <input name="identifier" required style="width:100%; margin:6px 0 14px; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text);">
      <label style="font-size:13px; color:var(--text2);">קוד / סיסמה</label>
      <input type="password" name="code" required style="width:100%; margin:6px 0 18px; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text);">
      <button type="submit" class="btn" style="width:100%;">כניסה</button>
    </form>
    <p style="font-size:12px; color:var(--text3); margin-top:16px; text-align:center;">
      בכניסה ראשונה יש להשתמש בקוד שקיבלת ממנהל המערכת. לאחריה תוכל להגדיר סיסמה קבועה.
    </p>
  </div>
</div>
{% endblock %}
