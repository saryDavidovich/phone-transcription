{% extends "institution/base.html" %}
{% block title %}הגדרת סיסמה{% endblock %}
{% block content %}
<div style="max-width:380px; margin:80px auto;">
  <div class="card">
    <h1 style="text-align:center;">ברוכים הבאים!</h1>
    <p style="font-size:13px; color:var(--text2); margin-bottom:18px; text-align:center;">
      זו הכניסה הראשונה שלך - נגדיר סיסמה קבועה במקום הקוד הזמני.
    </p>
    <form method="post">
      <label style="font-size:13px; color:var(--text2);">סיסמה חדשה</label>
      <input type="password" name="password" required style="width:100%; margin:6px 0 14px; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text);">
      <label style="font-size:13px; color:var(--text2);">אימות סיסמה</label>
      <input type="password" name="password2" required style="width:100%; margin:6px 0 18px; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text);">
      <button type="submit" class="btn" style="width:100%;">שמירת סיסמה</button>
    </form>
  </div>
</div>
{% endblock %}
