<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>כניסה למערכת</title>

<link rel="manifest" href="/admin/manifest.webmanifest?v=3">
<script>
/* התנתקות / כניסה מחדש: מוחקים את כל המידע ששמור במחשב לצפייה בלי חיבור */
try { if (window.caches) caches.delete('admin-pages'); } catch (e) {}
try { if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('clear'); } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Heebo',sans-serif; background:#0f1117; color:#e8eaf6; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-box { background:#1a1d27; border:1px solid #2d3150; border-radius:16px; padding:40px; width:100%; max-width:380px; }
.logo { text-align:center; font-size:24px; font-weight:800; margin-bottom:8px; }
.logo span { color:#4f6ef7; }
.subtitle { text-align:center; color:#8892b0; font-size:13px; margin-bottom:32px; }
.form-group { margin-bottom:16px; }
label { display:block; font-size:12px; color:#8892b0; margin-bottom:6px; font-weight:600; }
input { width:100%; padding:12px 14px; background:#22263a; border:1px solid #2d3150; border-radius:8px; color:#e8eaf6; font-size:14px; font-family:'Heebo',sans-serif; }
input:focus { outline:none; border-color:#4f6ef7; }
.btn { width:100%; padding:12px; background:#4f6ef7; color:white; border:none; border-radius:8px; font-size:15px; font-weight:700; font-family:'Heebo',sans-serif; cursor:pointer; margin-top:8px; }
.btn:hover { background:#3d5ce8; }
.error { background:rgba(239,68,68,0.15); color:#ef4444; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🎙️ מערכת <span>תמלול</span></div>
  <div class="subtitle">ממשק ניהול מנהל</div>
  {% with messages = get_flashed_messages() %}
    {% for msg in messages %}<div class="error">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>שם משתמש</label>
      <input type="text" name="username" autofocus required>
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">כניסה למערכת</button>
  </form>
</div>
</body>
</html>
