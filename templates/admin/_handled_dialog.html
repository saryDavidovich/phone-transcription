{# חלון "טופל" - נפתח עם openHandled(url, title, extraFields, onCancel). ההסבר חובה. #}
<dialog id="handledDlg" class="hd-dlg" dir="rtl">
  <form method="POST" id="handledForm">
    <div class="hd-head">
      <span class="hd-icon">✔</span>
      <div>
        <div class="hd-title">סימון כטופל</div>
        <div class="hd-sub" id="handledWhat"></div>
      </div>
    </div>
    <label class="hd-label" for="handledNote">מה נעשה?</label>
    <textarea id="handledNote" name="note" rows="4" required maxlength="2000"
              placeholder="למשל: חזרתי ללקוח בטלפון והסברתי איך לשלוח הקלטה"></textarea>
    <div class="hd-hint">ההסבר יישמר, ויוצג ליד ההודעה וברשימת ההתכתבויות.</div>
    <div id="handledExtra"></div>
    <div class="hd-actions">
      <button type="button" class="hd-cancel" onclick="closeHandled()">ביטול</button>
      <button type="submit" class="hd-ok">✔ טופל</button>
    </div>
  </form>
</dialog>
<style>
  .hd-dlg{position:fixed;inset:0;margin:auto;height:fit-content;max-height:90vh;border:1px solid var(--border,#2d3561);border-radius:16px;padding:0;width:min(460px,92vw);
          background:var(--surface,#1a1d2e);color:var(--text,#e2e8f0);box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .hd-dlg::backdrop{background:rgba(5,8,20,.6);backdrop-filter:blur(2px)}
  .hd-dlg form{padding:20px 22px}
  .hd-head{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .hd-icon{width:40px;height:40px;border-radius:50%;background:rgba(34,197,94,.15);color:#22c55e;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
  .hd-title{font-size:17px;font-weight:700}
  .hd-sub{font-size:13px;color:var(--text2,#8892b0);margin-top:2px}
  .hd-label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .hd-dlg textarea{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--border,#2d3561);background:var(--surface2,#22263a);
                   color:inherit;padding:10px 12px;font:inherit;font-size:14px;line-height:1.6;resize:vertical}
  .hd-dlg textarea:focus{outline:none;border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .hd-hint{font-size:12px;color:var(--text2,#8892b0);margin-top:6px}
  .hd-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
  .hd-ok{background:#22c55e;color:#06210f;border:none;border-radius:10px;padding:9px 20px;font-weight:700;font-size:14px;cursor:pointer}
  .hd-cancel{background:transparent;color:var(--text2,#8892b0);border:1px solid var(--border,#2d3561);border-radius:10px;padding:9px 18px;font-size:14px;cursor:pointer}
</style>
<script>
(function () {
  var cancelCb = null;
  window.openHandled = function (url, what, extra, onCancel) {
    var d = document.getElementById('handledDlg'), f = document.getElementById('handledForm');
    f.action = url;
    document.getElementById('handledWhat').textContent = what || '';
    document.getElementById('handledNote').value = '';
    var ex = document.getElementById('handledExtra'); ex.innerHTML = '';
    Object.keys(extra || {}).forEach(function (k) {
      var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = extra[k]; ex.appendChild(i);
    });
    cancelCb = onCancel || null;
    d.showModal();
    setTimeout(function () { document.getElementById('handledNote').focus(); }, 30);
  };
  window.closeHandled = function () {
    document.getElementById('handledDlg').close();
  };
  document.addEventListener('close', function (e) {
    if (e.target && e.target.id === 'handledDlg' && cancelCb) { var c = cancelCb; cancelCb = null; c(); }
  }, true);
  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'handledForm') cancelCb = null;
  }, true);
})();
</script>
