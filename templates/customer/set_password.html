{% extends "customer/base.html" %}
{% from "institution/_icons.html" import ic %}
{% block content %}
<div style="max-width:400px; width:100%;">
  <div class="card" style="box-shadow:var(--shadow-lg); padding:26px;">
    <div style="text-align:center; margin-bottom:16px;">
      <span class="ic-box" style="margin:0 auto 10px; width:44px; height:44px; border-radius:12px;">{{ ic('lock', 20) }}</span>
      <h1 style="margin:0 0 4px; font-size:20px;">בחירת סיסמה</h1>
      <p style="font-size:13px; color:var(--text2); line-height:1.7;">מעכשיו נכנסים עם מייל/טלפון וסיסמה. ממכשיר חדש יישלח גם קוד למייל.</p>
    </div>
    <form method="post" autocomplete="off">
      <div class="field"><label for="p1">סיסמה חדשה</label>
        <input class="input" type="password" id="p1" name="password" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="p2">שוב, לאימות</label>
        <input class="input" type="password" id="p2" name="password2" required minlength="8" autocomplete="new-password"></div>
      <ul class="pw-rules" id="rules">
        <li data-r="len">8 תווים לפחות</li><li data-r="mix">גם אותיות וגם ספרות</li><li data-r="same">שתי הסיסמאות זהות</li>
      </ul>
      <button type="submit" class="btn btn-block">{{ ic('check', 16, 2.2) }} שמירה וכניסה</button>
    </form>
  </div>
</div>
<style>
.pw-rules { list-style:none; display:flex; flex-direction:column; gap:4px; margin:0 0 14px; font-size:12.5px; color:var(--text3); }
.pw-rules li::before { content:'○'; margin-inline-end:6px; }
.pw-rules li.ok { color:var(--accent2); } .pw-rules li.ok::before { content:'✓'; }
</style>
<script>
(function () {
  var a = document.getElementById('p1'), b = document.getElementById('p2');
  function chk() {
    var v = a.value, r = { len: v.length >= 8, mix: /\d/.test(v) && /\D/.test(v), same: v && v === b.value };
    document.querySelectorAll('#rules li').forEach(function (li) { li.classList.toggle('ok', !!r[li.dataset.r]); });
  }
  a.addEventListener('input', chk); b.addEventListener('input', chk);
})();
</script>
{% endblock %}
